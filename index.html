@keyframes fill{from{width:0}to{width:100%}}
.svh{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);left:12px;right:12px;display:flex;align-items:center;gap:10px}

.shb{display:block;width:100%;border:0;background:none;padding:15px;font-size:17px;border-radius:14px}
.shb:active{background:var(--sf)}.shb.red{color:var(--red)}
</style></head><body>

<script>
const SB_URL='https://nseqfjpitmchomrumuae.supabase.co',SB_KEY='sb_publishable_cszD4zZZHpgrB9vLyg9yGg_4wJ8NmU0';
const $=s=>document.querySelector(s),sb=supabase.createClient(SB_URL,SB_KEY);
let me=null,room=null,rooms=[],pf={},last={},unread={},got=new Set(),gch=null,tab='chats',fold='all',oc=null,hb=null;
const IC={chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',pen:'<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',back:'<path d="M15 5l-7 7 7 7"/>',chev:'<path d="M9 5l7 7-7 7"/>',send:'<path d="M12 19V5M5 12l7-7 7 7"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',smile:'<circle cx="12" cy="12" r="9"/><path d="M8 14a5 5 0 0 0 8 0M9 9h.01M15 9h.01"/>',check:'<path d="M5 12l5 5 9-10"/>',more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',clip:'<path d="M21 12.5l-8.5 8.5a5.5 5.5 0 0 1-8-8L13 4.5a3.7 3.7 0 0 1 5.2 5.2L9.7 18.2a1.8 1.8 0 0 1-2.6-2.6L15 7.7"/>'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const show=id=>['auth','app'].forEach(x=>$('#'+x).hidden=x!==id);
const err=m=>$('#err').textContent=m||'';

const hue=s=>Math.abs([...s].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))%360;
const paint=(e,n)=>{e.style.background=`hsl(${hue(n)} 45% 45%)`;return e};
const nickOf=id=>(pf[id]&&pf[id].nick)||'user';
const dmOther=r=>(r.members||[]).find(x=>x!==me.id);

const sum=rs=>rs.reduce((a,r)=>a+(unread[r.id]||0),0);
const byLast=(a,b)=>(last[b.id]?.created_at||'').localeCompare(last[a.id]?.created_at||'');
function toast(t){const d=el('div','toast',t);$('#app').append(d);setTimeout(()=>d.remove(),2000)}
function pres(id){const p=pf[id];if(!p||!p.last_seen||Date.now()-new Date(p.last_seen)>100000)return null;return p.status==='away'?'away':p.status==='dnd'?'dnd':'online'}

function lastSeen(id){const p=pf[id];if(!p)return '';const s=pres(id),t=p.status_text?' · '+p.status_text:'';return s?SL[s]+t:(p.last_seen?'был(а) '+fmt(p.last_seen):'был(а) недавно')}

  const e=el('div','av'+(cls||'')),p=id&&pf[id];

async function auth(reg){
  const nick=$('#nick').value.trim().toLowerCase(),pw=$('#pw').value;
  if(!/^[a-z0-9_]{3,20}$/.test(nick))return err('Ник: 3–20 символов, латиница, цифры и _');
  if(pw.length<6)return err('Пароль не короче 6 символов');

  const r=reg?await sb.auth.signUp({email,password:pw,options:{data:{nick}}}):await sb.auth.signInWithPassword({email,password:pw});
  if(r.error)return err(reg?'Ник занят или пароль слишком простой':'Неверный ник или пароль');

}
async function loadProfiles(){const {data}=await sb.from('profiles').select('*');pf={};(data||[]).forEach(p=>pf[p.id]=p)}
async function loadPresence(){
  const {data}=await sb.from('profiles').select('id,status,status_text,last_seen,bio');
  let need=false;(data||[]).forEach(p=>{if(pf[p.id])Object.assign(pf[p.id],p);else need=true});
  if(need)await loadProfiles();await loadStories();

}
async function beat(){
  const p=pf[me&&me.id];if(!p)return;

async function loadRooms(){const {data}=await sb.from('rooms').select('*').order('id');rooms=data||[]}
async function loadLast(){
  const {data}=await sb.from('messages').select('*').order('created_at',{ascending:false}).limit(150);
  (data||[]).forEach(m=>{if(!last[m.room_id])last[m.room_id]=m});

function sub(){
  if(gch)return;
  gch=sb.channel('all')
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{
     const m=p.new;last[m.room_id]=m;
     if(room&&m.room_id===room.id)add(m);else if(m.user_id!==me.id)unread[m.room_id]=(unread[m.room_id]||0)+1;
     render()})
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'rooms'},async()=>{await loadProfiles();await loadRooms();render()})
   .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},p=>{const x=document.querySelector('.row[data-id="'+p.old.id+'"]');if(x)x.remove()})
   .on('postgres_changes',{event:'DELETE',schema:'public',table:'rooms'},async()=>{await loadRooms();if(room&&!rooms.find(x=>x.id===room.id))back();render()})
   .subscribe();
}

function img(f,max,sq){return new Promise((res,rej)=>{
  const im=new Image();im.onload=()=>{let w=im.width,h=im.height,sx=0,sy=0,sw=w,sh=h;
    if(sq){const s=Math.min(w,h);sx=(w-s)/2;sy=(h-s)/2;sw=sh=s;w=h=Math.min(s,max)}else{const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k)}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,w,h);URL.revokeObjectURL(im.src);c.toBlob(res,'image/jpeg',.82)};
  im.onerror=rej;im.src=URL.createObjectURL(f)})}

  v.onloadedmetadata=()=>{URL.revokeObjectURL(v.src);res(v.duration>sec?'Видео длиннее '+sec+' сек':'')};v.onerror=()=>res('');v.src=URL.createObjectURL(f)})}

    const l=by[uid]||[],b=el('button','st'),a=ava(nickOf(uid),'',uid);
    if(l.length){a.classList.add('ring');if(l.every(x=>seenSt.has(x.id)))a.classList.add('seen')}
    b.append(a,el('span',0,label));b.onclick=()=>l.length?viewStories(uid):$('#sf').click();
    if(uid===me.id){const p=el('u',0,'+');p.onclick=e=>{e.stopPropagation();$('#sf').click()};b.append(p)}
    return b};
  s.append(tile(me.id,'Моя'));
  Object.keys(by).filter(u=>u!==me.id).sort((a,b)=>by[b][by[b].length-1].created_at.localeCompare(by[a][by[a].length-1].created_at)).forEach(u=>s.append(tile(u,nickOf(u))));
}
$('#sf').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;toast('Загрузка…');
  const r=await prep(f,{dir:'s',max:1080,sec:60,mb:45});if(!r)return;
  const {error}=await sb.from('stories').insert({url:r.url,kind:r.kind});
  if(error)return toast('Не удалось опубликовать');await loadStories();render();toast('История опубликована');
};
function viewStories(uid){
  $('#pg').classList.remove('open');sv.l=stories.filter(s=>s.user_id===uid);if(!sv.l.length)return;
  sv.i=Math.max(0,sv.l.findIndex(s=>!seenSt.has(s.id)));showSt();
}
function closeSv(){clearTimeout(sv.t);const v=$('#sv');v.hidden=true;v.textContent='';v.onclick=null;render()}
function stNext(){sv.i++;sv.i>=sv.l.length?closeSv():showSt()}
function showSt(){
  clearTimeout(sv.t);const s=sv.l[sv.i],v=$('#sv');if(!s)return closeSv();
  v.hidden=false;v.textContent='';seenSt.add(s.id);
  try{localStorage.setItem('ss',JSON.stringify([...seenSt].slice(-300)))}catch(e){}
  const bars=el('div','bars');sv.l.forEach((_,k)=>bars.append(el('i',k<sv.i?'f':k===sv.i?'a':'')));
  const hd=el('div','svh');hd.append(ava(nickOf(s.user_id),' s',s.user_id),el('b',0,nickOf(s.user_id)),el('small',0,fmt(s.created_at)));
  if(s.user_id===me.id){const d=el('button','ic');d.innerHTML=ic('trash',22);
    d.onclick=async e=>{e.stopPropagation();await sb.from('stories').delete().eq('id',s.id);stories=stories.filter(x=>x.id!==s.id);sv.l.splice(sv.i,1);sv.i--;stNext()};hd.append(d)}
  const x=el('button','ic');x.innerHTML=ic('x',24);x.onclick=e=>{e.stopPropagation();closeSv()};hd.append(x);
  const m=el(s.kind==='video'?'video':'img');m.src=s.url;
  if(s.kind==='video'){m.autoplay=true;m.playsInline=true;m.onended=stNext;m.onloadedmetadata=()=>bars.style.setProperty('--d',m.duration+'s')}else sv.t=setTimeout(stNext,5000);
  v.onclick=e=>{if(e.clientX<innerWidth/3){sv.i=Math.max(0,sv.i-1);showSt()}else stNext()};
  v.append(m,bars,hd);
}
function profAv(p,id){
  if(p.avatar_video){const v=el('video','xlv');v.src=p.avatar_video;v.autoplay=v.loop=v.muted=v.playsInline=true;return v}
  return ava(p.nick,' xl',id,true);
}
function pView(id){
  if(id===me.id){$('#pg').classList.remove('open');setTab('me');return}
  const p=pf[id];if(!p)return;const b=$('#pgb');b.textContent='';$('#pgt').textContent='Профиль';
  const c=el('div','card');c.append(profAv(p,id),el('h2',0,p.nick),el('div','mu',lastSeen(id)));if(p.bio)c.append(el('p','bio',p.bio));
  const w=el('button','btn sm','Написать');w.onclick=()=>{$('#pg').classList.remove('open');openDM(id)};c.append(w);
  if(stories.some(s=>s.user_id===id)){const t=el('button','btn alt sm','Смотреть историю');t.onclick=()=>viewStories(id);c.append(t)}
  b.append(c);$('#pg').classList.add('open');
}
theme(curTheme());
sb.auth.getSession().then(r=>start(r.data.session));
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
