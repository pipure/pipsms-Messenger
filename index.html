<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PipSms</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0E5A8A">
<style>
:root{--bg:#F2F5F8;--sf:#fff;--tx:#14202B;--mu:#6A7886;--pr:#0E5A8A;--on:#fff;--pip:#FFC83D;--ln:#DDE4EA;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0F1720;--sf:#18232F;--tx:#E8EEF3;--mu:#8D9BA8;--pr:#4DA3DB;--on:#07202F;--ln:#26343F;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
section{height:100%;display:flex;flex-direction:column}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--pr);color:var(--on)}
header h1{font-size:19px;flex:1}
header button{background:none;border:0;color:inherit;font-size:15px;padding:6px}
button,input{font:inherit}
.dot{width:12px;height:12px;border-radius:50%;background:var(--pip);display:inline-block;margin-right:6px}
#auth{justify-content:center;padding:24px;gap:12px;max-width:420px;margin:auto}
#auth h1{font-size:32px}
#auth p{color:var(--mu)}
input{padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx);width:100%}
.btn{padding:12px;border:0;border-radius:10px;background:var(--pr);color:var(--on);font-weight:600}
.btn.alt{background:none;color:var(--pr);border:1px solid var(--pr)}
#err{color:#C0392B;min-height:20px;font-size:14px}
#list{flex:1;overflow:auto;padding:8px}
.room{display:block;width:100%;text-align:left;padding:14px;margin-bottom:6px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx)}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:8px 12px;border-radius:16px 16px 16px 4px;background:var(--sf);border:1px solid var(--ln);overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--pr);color:var(--on);border:0;border-radius:16px 16px 4px 16px}
.m b{display:block;font-size:13px;color:var(--pr)}
.m i{display:block;font-size:11px;opacity:.65;font-style:normal;text-align:right}
form{display:flex;gap:8px;padding:10px;background:var(--sf);border-top:1px solid var(--ln)}
form .btn{width:48px;padding:0}
</style></head><body>
<section id="auth" hidden>
  <h1><span class="dot"></span>PipSms</h1>
  <p>Войдите по нику и паролю. Номер телефона не нужен.</p>
  <input id="nick" placeholder="Ник (латиница, цифры, _)" autocapitalize="none" autocomplete="username">
  <input id="pw" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
  <div id="err"></div>
  <button class="btn" onclick="auth(false)">Войти</button>
  <button class="btn alt" onclick="auth(true)">Создать аккаунт</button>
</section>
<section id="rooms" hidden>
  <header><h1><span class="dot"></span>PipSms</h1><button onclick="newRoom()">+ Комната</button><button onclick="out()">Выйти</button></header>
  <div id="list"></div>
</section>
<section id="chat" hidden>
  <header><button onclick="back()">←</button><h1 id="rt"></h1></header>
  <div id="msgs"></div>
  <form id="f"><input id="tx" placeholder="Сообщение" autocomplete="off"><button class="btn">➤</button></form>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://nseqfjpitmchomrumuae.supabase.co',SB_KEY='sb_publishable_cszD4zZZHpgrB9vLyg9yGg_4wJ8NmU0';
const $=s=>document.querySelector(s),sb=supabase.createClient(SB_URL,SB_KEY);
let me=null,room=null,ch=null,seen=new Set();
const show=id=>['auth','rooms','chat'].forEach(x=>$('#'+x).hidden=x!==id);
const err=m=>$('#err').textContent=m||'';
async function auth(reg){
  const nick=$('#nick').value.trim().toLowerCase(),pw=$('#pw').value;
  if(!/^[a-z0-9_]{3,20}$/.test(nick))return err('Ник: 3–20 символов, латиница, цифры и _');
  if(pw.length<6)return err('Пароль не короче 6 символов');
  const email=nick+'@pipsms.app';
  const r=reg?await sb.auth.signUp({email,password:pw,options:{data:{nick}}}):await sb.auth.signInWithPassword({email,password:pw});
  if(r.error)return err(reg?'Ник занят или пароль слишком простой':'Неверный ник или пароль');
  if(!r.data.session)return err('Отключите подтверждение почты в настройках Supabase');
  err();start(r.data.session);
}
function start(s){
  if(!s){show('auth');return}
  me=s.user;show('rooms');loadRooms();
}
async function loadRooms(){
  const {data,error}=await sb.from('rooms').select('*').order('name');
  const l=$('#list');l.textContent='';
  if(error||!data.length){l.textContent='Комнат пока нет. Создайте первую.';return}
  data.forEach(r=>{const b=document.createElement('button');b.className='room';b.textContent=r.name;b.onclick=()=>open(r);l.append(b)});
}
async function newRoom(){
  const name=(prompt('Название комнаты')||'').trim().slice(0,40);
  if(!name)return;
  const {error}=await sb.from('rooms').insert({name});
  if(error)alert('Такая комната уже есть');
  loadRooms();
}
async function open(r){
  room=r;seen=new Set();$('#rt').textContent=r.name;$('#msgs').textContent='';show('chat');
  const {data}=await sb.from('messages').select('*').eq('room_id',r.id).order('created_at',{ascending:false}).limit(100);
  (data||[]).reverse().forEach(add);
  if(ch)sb.removeChannel(ch);
  ch=sb.channel('room'+r.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'room_id=eq.'+r.id},p=>add(p.new)).subscribe();
}
function add(m){
  if(seen.has(m.id))return;seen.add(m.id);
  const d=document.createElement('div'),mine=m.user_id===me.id;d.className='m'+(mine?' me':'');
  if(!mine){const b=document.createElement('b');b.textContent=m.nick;d.append(b)}
  d.append(document.createTextNode(m.body));
  const t=document.createElement('i');t.textContent=new Date(m.created_at).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});d.append(t);
  const box=$('#msgs');box.append(d);box.scrollTop=box.scrollHeight;
}
$('#f').onsubmit=async e=>{
  e.preventDefault();
  const body=$('#tx').value.trim();if(!body)return;
  $('#tx').value='';
  const {data,error}=await sb.from('messages').insert({room_id:room.id,nick:me.user_metadata.nick,body}).select().single();
  if(error)alert('Сообщение не отправилось');else add(data);
};
function back(){if(ch){sb.removeChannel(ch);ch=null}show('rooms')}
async function out(){await sb.auth.signOut();me=null;show('auth')}
sb.auth.getSession().then(r=>start(r.data.session));
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
